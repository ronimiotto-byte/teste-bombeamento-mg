name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Dependencias
        run: npm install
      - name: Projeto Android
        run: npx cap add android
      - name: Icone
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
      - name: Permissoes
        run: python3 scripts/patch_android.py
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TesteBombeamentoMG.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TesteBombeamentoMG
          path: TesteBombeamentoMG.apk
      - name: Publicar versao
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Teste de Bombeamento M&G v1.${{ github.run_number }}
          files: TesteBombeamentoMG.apk
          make_latest: true
